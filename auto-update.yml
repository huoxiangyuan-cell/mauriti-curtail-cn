name: 每日自动更新 ONS 数据
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install requests pandas
      - name: 拉取 ONS 数据并更新 JSON
        run: python py/fetch_ons_data.py
      - name: 提交更新
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add data/monthly_data.json
          git commit -m "自动更新数据 $(date '+%Y-%m-%d')"
          git push