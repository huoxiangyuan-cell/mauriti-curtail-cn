<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛里蒂光伏电站 - 弃电分析平台</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>毛里蒂光伏电站 | 弃电分析可视化平台</h1>
        <p class="sub-title">巴西塞阿拉州 | 数据来源：ONS / CCEE / NASA</p>
        <p class="update">数据更新时间：<span id="update-time">加载中...</span></p>
    </header>

    <div class="filter-box">
        <label>选择月份：</label>
        <select id="month-select">
            <option value="2025-12">2025年12月</option>
            <option value="2025-11">2025年11月</option>
            <option value="2025-10">2025年10月</option>
        </select>
    </div>

    <section class="cards">
        <div class="card green">
            <h3>实际发电量</h3>
            <p id="gen-power">加载中...</p>
        </div>
        <div class="card orange">
            <h3>弃电量</h3>
            <p id="curt-power">加载中...</p>
        </div>
        <div class="card gray">
            <h3>理论可发电量</h3>
            <p id="total-power">加载中...</p>
        </div>
        <div class="card blue">
            <h3>综合弃电率</h3>
            <p id="curt-rate">加载中...</p>
        </div>
    </section>

    <section class="chart-box">
        <h2>📊 月度弃电 & 发电量趋势</h2>
        <div id="chart1" class="chart"></div>
    </section>

    <section class="chart-box">
        <h2>📊 弃电原因分布占比</h2>
        <div id="chart2" class="chart"></div>
    </section>

    <section class="chart-box">
        <h2>📊 日内弃电规律（热力图）</h2>
        <div id="chart3" class="chart"></div>
    </section>

    <section class="chart-box">
        <h2>💰 REN 1030 可索赔弃电统计</h2>
        <div class="claim-box">
            <p><strong>可索赔总电量：</strong><span id="claim-power">加载中...</span></p>
            <p><strong>可索赔金额：</strong><span id="claim-money">加载中...</span></p>
            <p><strong>可索赔类型：</strong>CNF(电网可靠性) + REL(外部线路受限)</p>
            <button class="btn" onclick="exportCSV()">导出索赔清单 CSV</button>
        </div>
    </section>

    <footer>
        毛里蒂光伏弃电分析平台 © 2025 | 中文汉化版 | 数据每日自动更新
    </footer>
</div>

<script>
let currentData = null;

async function loadData(month) {
    const res = await fetch('./data/monthly_data.json');
    const json = await res.json();
    currentData = json;
    document.getElementById('update-time').textContent = json.update_time;

    document.getElementById('gen-power').textContent = json.generation + ' GWh';
    document.getElementById('curt-power').textContent = json.curtailment + ' GWh';
    document.getElementById('total-power').textContent = json.total_gen + ' GWh';
    document.getElementById('curt-rate').textContent = json.curt_rate + ' %';
    document.getElementById('claim-power').textContent = json.claim_power + ' GWh';
    document.getElementById('claim-money').textContent = json.claim_money;

    renderCharts(json);
}

function renderCharts(data) {
    let chart1 = echarts.init(document.getElementById('chart1'));
    chart1.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { data: data.months },
        yAxis: [{ type: 'value' }, { type: 'value', position: 'right' }],
        series: [
            { name: '实际发电量(GWh)', type: 'bar', data: data.gen_data },
            { name: '弃电率(%)', type: 'line', yAxisIndex: 1, data: data.rate_data }
        ]
    });

    let chart2 = echarts.init(document.getElementById('chart2'));
    chart2.setOption({
        tooltip: { trigger: 'item' },
        series: { type: 'pie', data: data.reason_data }
    });

    let chart3 = echarts.init(document.getElementById('chart3'));
    chart3.setOption({
        visualMap: { min: 0, max: 100 },
        xAxis: { data: data.hours },
        yAxis: { data: ['弃电强度'] },
        series: { type: 'heatmap', data: data.heat_data }
    });
}

function exportCSV() {
    const rows = [
        ['日期', '弃电量(MWh)', '类型', '可索赔'],
        ...currentData.claim_list.map(i => [i.date, i.value, i.type, i.claim])
    ];
    const csv = rows.map(e => e.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '毛里蒂_可索赔弃电清单.csv';
    a.click();
}

loadData('2025-12');
document.getElementById('month-select').addEventListener('change', e => {
    loadData(e.target.value);
});
window.addEventListener('resize',()=>{
    echarts.getInstanceByDom(document.getElementById('chart1')).resize();
    echarts.getInstanceByDom(document.getElementById('chart2')).resize();
    echarts.getInstanceByDom(document.getElementById('chart3')).resize();
})
</script>
</body>
</html>
